# Calma verification backend on Fly.io. A persistent single instance: live jobs stay in memory, but every
# job is write-through-persisted to SQLite on the mounted volume (below), so a redeploy/restart no longer
# orphans finished runs. Secrets are set via `flyctl secrets set` (see DEPLOY.md), never committed here.
app = "calma-engine"   # the verification backend ("verify"/"calma-verify" is blocked by Fly's abuse filter)
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  CALMA_FORCE_E2B = "1"   # public backend: every run is isolated in E2B, never on this host
  CALMA_DATA_DIR = "/data"   # durable job store lives here (see [mounts]); survives redeploys

# A persistent volume for the job store (core/jobstore.py → /data/jobs.db). Create it once before the first
# deploy: `flyctl volumes create calma_data --region sjc --size 1 -a calma-engine`. Single machine, single
# volume (min_machines_running = 1 below), so history is durable without a managed DB.
[mounts]
  source = "calma_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false      # keep the instance up so in-memory job state survives a verification
  auto_start_machines = true
  min_machines_running = 1

  # Fly restarts the machine if the API stops answering. /healthz is cheap + unauthenticated.
  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
