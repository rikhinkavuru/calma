# Build + publish the Calma validity-check action image to GHCR so consumers pull a PREBUILT image instead of
# rebuilding the SciPy stack on every PR (minutes → seconds, and a pin that ever fails to resolve is caught HERE
# once, not in every consumer's CI). Uses the repo's built-in GITHUB_TOKEN — no manual credentials.
name: Publish validity-check image

on:
  push:
    branches: [main]
    paths: ['Dockerfile', '.dockerignore', 'action/**', 'spike/**', '.github/workflows/publish-validity-image.yml']
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write        # push to ghcr.io/<owner>/calma-validity

concurrency:                       # a newer main push supersedes an in-flight build of the same tag
  group: publish-validity-image
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/calma-validity
          # :latest on main; :vX.Y.Z + :vX on a release/tag (so `uses: …@v1` is a PINNED image); :sha-<commit> always
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}
            type=sha,prefix=sha-,format=long

      - name: Build + push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test the built image
        run: |
          # prove the recompute stack (numpy/sklearn/pandas pins) actually loads + the CLI runs before it ships
          docker run --rm --entrypoint python \
            ghcr.io/${{ github.repository_owner }}/calma-validity:sha-${{ github.sha }} \
            /calma/spike/validity_scan.py --help >/dev/null
          echo "validity_scan CLI + recompute stack OK in the published image"
