# Calma validity check — self-check on every PR. Catches data leakage / trivial baselines / misreports with no
# run, and posts a report-card comment. Fail-closed: nothing to check is INCOMPLETE, never a false verdict.
# Runs the scanner DIRECTLY (setup-python), so the repo's own gate never depends on the published-image lifecycle
# — external consumers use the prebuilt Docker action (see action.yml + publish-validity-image.yml).
name: Calma validity check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write        # to post the report-card comment

jobs:
  validity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install the recompute stack
        run: pip install --no-cache-dir numpy scikit-learn scipy pandas PyYAML
      - name: Calma validity check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          PYTHONPATH: ${{ github.workspace }}/spike:${{ github.workspace }}/spike/capture
        run: |
          python spike/validity_scan.py spike/fixtures \
            --format md \
            --out /tmp/calma_card.json \
            --summary-file "$GITHUB_STEP_SUMMARY" \
            --fail-on never | tee /tmp/calma_card.md
          python action/pr_comment.py /tmp/calma_card.md || echo "calma: PR comment skipped (no PR / token)"
